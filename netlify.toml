# Netlify Configuration for AppRecorder

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Route /api/proxy to the Netlify Serverless Proxy Function
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/proxy/*"
  to = "/.netlify/functions/proxy"
  status = 200

# Route dynamic chunks and assets through proxy function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy"
  status = 200

# Route all SPA application routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Standard Security & Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

